name: Verify Dewify builder
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check builder-core.js
          node --check builder-app.js
          node --check builder-export-v2.js
          node --check builder-stars.js
          node --check scripts/verify_builder.mjs
      - name: Run builder assertions
        run: node scripts/verify_builder.mjs
