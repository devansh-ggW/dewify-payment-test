name: Bootstrap payment-test from Dewify-Ecommerce

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          git clone --depth 1 https://github.com/devansh-ggW/Dewify-Ecommerce.git _source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name _source -exec rm -rf {} +
          cp -a _source/. .
          rm -rf _source
          rm -f .github/workflows/bootstrap-payment-test.yml
          rm -f CNAME
          printf '%s\n' '# Dewify Payment Test' > PAYMENT-TEST-BOOTSTRAP.md
          printf '%s\n' 'This repository is a safe testing copy of Dewify-Ecommerce for Razorpay + Stripe + Cloudflare Worker integration.' >> PAYMENT-TEST-BOOTSTRAP.md

      - name: Commit copied repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: copy Dewify-Ecommerce into payment test repo" || exit 0
          git push origin HEAD:main
