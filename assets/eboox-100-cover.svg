<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/><stop offset=".52" stop-color="#edf6ff"/><stop offset="1" stop-color="#cfe5fb"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#1d6fd8"/><stop offset=".55" stop-color="#5ea4ff"/><stop offset="1" stop-color="#0b3d82"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#101820"/><stop offset="1" stop-color="#263746"/>
  </linearGradient>
  <pattern id="micro" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="7" r=".8" fill="#0a4178" opacity=".08"/>
    <circle cx="19" cy="21" r=".65" fill="#0a4178" opacity=".06"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07111b" flood-opacity=".20"/>
  </filter>
</defs>
<title id="title">EBOOX 100</title>
<desc id="desc">A premium white, blue and black digital library cover.</desc>

<rect width="1024" height="1536" fill="#f4f9fd"/>
<rect width="1024" height="1536" fill="url(#paper)"/>
<rect width="1024" height="1536" fill="url(#micro)"/>

<!-- architectural blue field -->
<path d="M0 0H1024V430L820 560H0Z" fill="#0d3d72"/>
<path d="M0 0H1024V355L760 500H0Z" fill="#092d54" opacity=".55"/>
<path d="M0 0H760L540 122H0Z" fill="#2a83e3" opacity=".45"/>
<path d="M72 94H952" stroke="#cfe8ff" stroke-opacity=".28"/>
<text x="72" y="138" fill="#e9f5ff" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="8">DEWIFY / DIGITAL LIBRARY</text>
<text x="72" y="194" fill="#82c0ff" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="5">CURATED KNOWLEDGE COLLECTION</text>

<!-- title -->
<text x="72" y="558" fill="#0a1824" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900" letter-spacing="-6">EBOOX</text>
<text x="72" y="684" fill="url(#blue)" font-family="Arial,Helvetica,sans-serif" font-size="164" font-weight="900" letter-spacing="-10">100</text>
<rect x="74" y="734" width="180" height="5" fill="#1767c5"/>
<text x="72" y="790" fill="#29404f" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="4">100 BOOKS / ONE DIGITAL LIBRARY</text>
<text x="72" y="836" fill="#5d7180" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2">AI • MONEY • BUSINESS • STRATEGY • SKILLS • EXECUTION</text>

<!-- floating book stack -->
<g transform="translate(590 875)" filter="url(#shadow)">
  <rect x="0" y="175" width="300" height="86" rx="8" fill="#0e1b25" transform="rotate(-7 150 218)"/>
  <rect x="18" y="108" width="300" height="86" rx="8" fill="#ffffff" stroke="#b8cfe4" transform="rotate(5 168 151)"/>
  <rect x="-4" y="42" width="300" height="86" rx="8" fill="url(#blue)" transform="rotate(-3 146 85)"/>
  <rect x="36" y="-18" width="300" height="86" rx="8" fill="#f7fbff" stroke="#9db9d1" transform="rotate(8 186 25)"/>
  <text x="186" y="30" text-anchor="middle" fill="#103b67" font-family="Georgia,serif" font-size="24" font-weight="700" transform="rotate(8 186 25)">IDEAS → ACTION</text>
  <text x="146" y="96" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="3" transform="rotate(-3 146 96)">AI / BUSINESS</text>
  <text x="168" y="164" text-anchor="middle" fill="#153a5d" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="2" transform="rotate(5 168 164)">LEARN / BUILD / GROW</text>
  <text x="150" y="236" text-anchor="middle" fill="#d7e5ee" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="4" transform="rotate(-7 150 236)">EBOOX / 100</text>
</g>

<!-- information card -->
<g transform="translate(72 1050)">
  <rect width="460" height="245" rx="14" fill="#ffffff" fill-opacity=".8" stroke="#b8d2e8"/>
  <text x="28" y="44" fill="#1c64a9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="4">INSIDE THE COLLECTION</text>
  <text x="28" y="91" fill="#112432" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">Practical knowledge,</text>
  <text x="28" y="126" fill="#112432" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">packaged for action.</text>
  <path d="M28 154H400" stroke="#b7cad8"/>
  <text x="28" y="188" fill="#5f7382" font-family="Arial,Helvetica,sans-serif" font-size="16">READ • EXTRACT • APPLY</text>
  <text x="28" y="219" fill="#5f7382" font-family="Arial,Helvetica,sans-serif" font-size="16">A focused digital shelf for builders.</text>
</g>

<text x="72" y="1416" fill="#153b5d" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="6">EBOOX 100</text>
<text x="952" y="1416" text-anchor="end" fill="#6f8493" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">DEWIFY</text>
</svg>